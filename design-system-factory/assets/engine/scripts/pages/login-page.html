  <title>登录页模板 - 广发中后台设计系统</title>
  <!--
    ============================================================
    模板：登录页（LoginPage）
    规范：pages/login-page.md + components/data-entry.md + basic.md
    版本：design-specs v2.5

    两种样式二选一（默认样式一）：
      样式一 · 双栏  —— 渐变背景 + 980×616 双栏卡（左品牌 490 / 右表单 490）
      样式二 · 单栏  —— 白底 + 408×430 单栏卡（水平垂直居中）
      切换方式：给 .gf-login 追加 class="gf-login--plain" 即为样式二；
                或直接删除 .gf-login__brand 品牌区并改用 --plain 规则。

    必做替换（搜索「业务替换点」）：
      1. <title> 与品牌区：.gf-login__brand-mark 字样、.gf-login__brand-name 系统名
      2. .gf-login__brand 内联 SVG 插图（必须手绘内联，禁止外链图片/图标库）
      3. .gf-login__title 标题文案、.gf-login__subtitle 副标题
      4. 提交逻辑：form submit 回调中的接口调用（现有为 setTimeout 模拟）
      5. 忘记密码跳转链接

    强约束（改动即踩坑）：
      · 输入框容器必须 position: relative，图标绝对定位 top:50% + translateY(-50%)
      · 带前缀/后缀图标的输入框必须预留 36px padding，禁止文字压图标
      · 图标禁止固定 top 像素值定位
      · 控件宽度统一 --login-field-width(300px)，禁止自由数值
      · 间距节奏：标题→输入框 32px、输入框间 16px、输入框→辅助区 16px、辅助区→按钮 16px
    ============================================================
  -->
  <style>
    :root {
      /* ---- 品牌与功能色（取值唯一来源：foundation/tokens.md） ---- */
      --color-primary: #2A6CDD;
      --color-primary-hover: #1E5BBF;
      --color-primary-active: #164A9E;
      --color-primary-light: rgba(42, 108, 221, 0.1);
      --color-primary-focus: rgba(42, 108, 221, 0.2);
      --color-error: #F5222D;
      --color-error-text: #C80000;
      --color-error-bg: #FEEBEC;
      --color-success-text: #2CAA41;
      --color-accent-2: #F4FAFF;
      --color-accent-3: #E6F4FE;
      --color-accent-6: #ACD8FC;
      /* ---- 中性色 ---- */
      --color-white: #FFFFFF;
      --color-on-primary: #FFFFFF;
      --color-on-primary-muted: rgba(255, 255, 255, 0.4);
      --color-bg-canvas: #F7F8FA;
      --color-text: #313133;
      --color-text-secondary: #67696E;
      --color-text-tertiary: #939599;
      --color-text-quaternary: #C8C9CC;
      --color-text-heading: #13161B;
      --color-border: #F0F2F5;
      --color-border-secondary: #E6EAF0;
      --color-border-strong: #D7DCE0;
      /* ---- 登录页专用 ---- */
      --login-bg-start: #E6F0FF;
      --login-bg-mid: #DCE7FF;
      --login-bg-end: #D8DBFF;
      --login-card-width: 980px;
      --login-card-height: 616px;
      --login-card-pad-y: 14px;
      --login-card-pad-x: 18px;
      --login-field-width: 300px;
      /* ---- 圆角 / 阴影 / 间距 / 动效 ---- */
      --radius-btn: 2px;
      --radius-card: 4px;
      --shadow-card: 0px 2px 8px rgba(0, 0, 0, 0.10);
      --shadow-medium: 0px 6px 16px rgba(0, 0, 0, 0.12);
      --space-1: 4px; --space-2: 8px; --space-3: 12px;
      --space-4: 16px; --space-6: 24px; --space-8: 32px;
      --transition-fast: 200ms ease-in-out;
      --transition-normal: 300ms ease-in-out;
      /* ---- 字体 ---- */
      --font-family: 'Microsoft YaHei', 'PingFang SC', 'SF Pro Display', 'DIN Alternate', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: var(--font-family); color: var(--color-text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    button, input { font-family: var(--font-family); }

    /* ============ 样式一：渐变背景 + 双栏登录卡 ============ */
    .gf-login {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: var(--space-8) var(--space-6);
      background: linear-gradient(to bottom, var(--login-bg-start) 0%, var(--login-bg-mid) 50%, var(--login-bg-end) 100%);
      transition: background var(--transition-normal);
    }
    .gf-login__card {
      width: var(--login-card-width); height: var(--login-card-height);
      background: var(--color-white); border-radius: var(--radius-card);
      box-shadow: var(--shadow-medium);
      padding: var(--login-card-pad-y) var(--login-card-pad-x);
      display: flex; overflow: hidden;
    }

    /* ---- 左侧品牌区 490 × 580 ---- */
    .gf-login__brand {
      flex: 1; min-width: 0; border-radius: var(--radius-card);
      background: var(--color-accent-2);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: var(--space-8); gap: var(--space-6);
    }
    .gf-login__brand-logo { display: flex; align-items: center; gap: var(--space-2); }
    .gf-login__brand-mark {
      width: 32px; height: 32px; border-radius: var(--radius-card);
      background: var(--color-primary); color: var(--color-on-primary);
      font-size: 16px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
    }
    .gf-login__brand-name { font-size: 18px; font-weight: 600; color: var(--color-text-heading); letter-spacing: 1px; }
    .gf-login__brand-slogan { font-size: 13px; color: var(--color-text-tertiary); text-align: center; line-height: 1.8; max-width: 300px; }

    /* ---- 右侧表单区 490 × 580，内容 300px 垂直居中 ---- */
    .gf-login__panel {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 0 var(--space-8);
    }
    .gf-login__inner { width: var(--login-field-width); }

    .gf-login__title { font-size: 32px; font-weight: 500; color: var(--color-text-heading); line-height: 1.4; margin-bottom: 14px; }
    .gf-login__subtitle { font-size: 13px; color: var(--color-text-tertiary); margin-bottom: var(--space-6); }

    /* ---- 输入框 300 × 40，图标绝对定位居中 ---- */
    .gf-field { position: relative; margin-bottom: var(--space-4); }
    .gf-field__icon {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--color-text-quaternary);
      pointer-events: none; transition: color var(--transition-fast);
    }
    .gf-field__icon--prefix { left: var(--space-2); }
    .gf-field__icon--suffix { right: var(--space-2); pointer-events: auto; cursor: pointer; background: none; border: none; padding: 0; }
    .gf-field__icon--suffix:hover { color: var(--color-primary); }
    .gf-field__input {
      width: 100%; height: 40px;
      padding: 0 var(--space-4) 0 36px;
      border: 1px solid var(--color-border-strong); border-radius: var(--radius-btn);
      background: var(--color-white); color: var(--color-text); font-size: 14px; font-weight: 400;
      outline: none; transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .gf-field__input::placeholder { color: var(--color-text-quaternary); font-size: 14px; font-weight: 400; }
    .gf-field__input:hover { border-color: var(--color-primary); }
    .gf-field__input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 2px var(--color-primary-light); }
    .gf-field--suffix .gf-field__input { padding-right: 36px; }
    .gf-field--error .gf-field__input { border-color: var(--color-error); }
    .gf-field__error { display: none; font-size: 12px; color: var(--color-error-text); margin-top: var(--space-1); line-height: 1.5; }
    .gf-field--error .gf-field__error { display: block; }

    /* ---- 辅助操作区 300 × 20 ---- */
    .gf-login__assist { width: 100%; height: 20px; margin-bottom: var(--space-4); display: flex; align-items: center; justify-content: space-between; }
    .gf-check { display: flex; align-items: center; gap: var(--space-2); cursor: pointer; user-select: none; }
    .gf-check__box { width: 14px; height: 14px; border-radius: var(--radius-btn); accent-color: var(--color-primary); cursor: pointer; margin: 0; flex-shrink: 0; }
    .gf-check__label { font-size: 14px; font-weight: 400; color: var(--color-text-tertiary); }
    .gf-login__forgot { font-size: 14px; font-weight: 500; color: var(--color-primary); text-decoration: none; background: none; border: none; cursor: pointer; padding: 0; }
    .gf-login__forgot:hover { color: var(--color-primary-hover); text-decoration: underline; }

    /* ---- 登录按钮 300 × 40 ---- */
    .gf-login__submit {
      width: 100%; height: 40px;
      border: 1px solid var(--color-primary); border-radius: var(--radius-btn);
      background: var(--color-primary); color: var(--color-on-primary);
      font-size: 16px; font-weight: 500; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }
    .gf-login__submit:hover { background: var(--color-primary-hover); border-color: var(--color-primary-hover); }
    .gf-login__submit:active { background: var(--color-primary-active); border-color: var(--color-primary-active); }
    .gf-login__submit--loading { pointer-events: none; opacity: 0.75; }
    .gf-spinner {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid var(--color-on-primary-muted); border-top-color: var(--color-on-primary);
      animation: gf-spin 0.7s linear infinite;
    }
    @keyframes gf-spin { to { transform: rotate(360deg); } }

    /* ---- 全局错误提示 ---- */
    .gf-login__alert {
      display: none; align-items: flex-start; gap: var(--space-2);
      background: var(--color-error-bg); border-radius: var(--radius-card);
      padding: var(--space-2) var(--space-3); margin-bottom: var(--space-4);
      color: var(--color-error-text); font-size: 13px; line-height: 20px;
    }
    .gf-login__alert--show { display: flex; }
    .gf-login__alert svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }

    .gf-login__hint { margin-top: var(--space-6); font-size: 12px; color: var(--color-text-quaternary); text-align: center; line-height: 1.8; }

    /* ============ 样式二：白底单栏登录卡 408 × 430 ============ */
    .gf-login--plain { background: var(--color-white); }
    .gf-login--plain .gf-login__card { width: 408px; height: 430px; padding: var(--space-8); box-shadow: var(--shadow-card); }
    .gf-login--plain .gf-login__brand { display: none; }
    .gf-login--plain .gf-login__panel { padding: 0; }
    .gf-login--plain .gf-login__subtitle { display: none; }
    .gf-login--plain .gf-login__hint { display: none; }

    /* ============ 响应式：≤1200px 双栏降级为单栏 ============ */
    @media (max-width: 1200px) {
      .gf-login__card { width: 408px; height: 430px; padding: var(--space-8); box-shadow: var(--shadow-card); }
      .gf-login__brand { display: none; }
      .gf-login__panel { padding: 0; }
      .gf-login__subtitle, .gf-login__hint { display: none; }
    }
    @media (max-width: 480px) {
      .gf-login { padding: var(--space-4); }
      .gf-login__card, .gf-login--plain .gf-login__card { width: 100%; height: auto; min-height: 430px; }
      .gf-login__inner { width: 100%; }
    }
  </style>
</head>

  </main>

  <script>
    (function () {
      var REMEMBER_KEY = 'gf_login_username';

      var form = document.getElementById('loginForm');
      var username = document.getElementById('username');
      var password = document.getElementById('password');
      var remember = document.getElementById('remember');
      var btnSubmit = document.getElementById('btnSubmit');
      var pwdToggle = document.getElementById('pwdToggle');
      var iconEye = document.getElementById('iconEye');
      var alertBox = document.getElementById('loginAlert');
      var alertText = document.getElementById('loginAlertText');
      var fieldUser = document.getElementById('fieldUser');
      var fieldPwd = document.getElementById('fieldPwd');
      var userError = document.getElementById('userError');
      var pwdError = document.getElementById('pwdError');

      var EYE_OFF = '<path d="M1.75 8C1.75 8 4 4.25 8 4.25C12 4.25 14.25 8 14.25 8C14.25 8 12 11.75 8 11.75C4 11.75 1.75 8 1.75 8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>'
        + '<path d="M2.5 13.5L13.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>';
      var EYE_ON = '<path d="M1.75 8C1.75 8 4 4.25 8 4.25C12 4.25 14.25 8 14.25 8C14.25 8 12 11.75 8 11.75C4 11.75 1.75 8 1.75 8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>'
        + '<circle cx="8" cy="8" r="1.9" stroke="currentColor" stroke-width="1.4"/>';

      /* ---------- 记住密码：仅回填用户名，不存储口令 ---------- */
      try {
        var saved = localStorage.getItem(REMEMBER_KEY);
        if (saved) { username.value = saved; remember.checked = true; }
      } catch (e) { /* 隐私模式下 localStorage 不可用，静默降级 */ }

      /* ---------- 密码可见性切换 ---------- */
      pwdToggle.addEventListener('click', function () {
        var masked = password.type === 'password';
        password.type = masked ? 'text' : 'password';
        iconEye.innerHTML = masked ? EYE_OFF : EYE_ON;
        this.setAttribute('title', masked ? '隐藏密码' : '显示密码');
        password.focus();
      });

      function hideAlert() { alertBox.classList.remove('gf-login__alert--show'); }
      function showAlert(msg) { alertText.textContent = msg; alertBox.classList.add('gf-login__alert--show'); }

      username.addEventListener('input', function () { fieldUser.classList.remove('gf-field--error'); hideAlert(); });
      password.addEventListener('input', function () { fieldPwd.classList.remove('gf-field--error'); hideAlert(); });

      /* ---------- 提交：校验 → 加载态 → 业务替换点 ---------- */
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        hideAlert();
        fieldUser.classList.remove('gf-field--error');
        fieldPwd.classList.remove('gf-field--error');

        var name = username.value.trim();
        var pwd = password.value;
        var ok = true;

        if (!name) { fieldUser.classList.add('gf-field--error'); userError.textContent = '请输入用户名/工号'; ok = false; }
        if (!pwd) { fieldPwd.classList.add('gf-field--error'); pwdError.textContent = '请输入密码'; ok = false; }
        else if (pwd.length < 6) { fieldPwd.classList.add('gf-field--error'); pwdError.textContent = '密码长度不少于 6 位'; ok = false; }
        if (!ok) return;

        try {
          if (remember.checked) localStorage.setItem(REMEMBER_KEY, name);
          else localStorage.removeItem(REMEMBER_KEY);
        } catch (err) { /* 忽略存储异常 */ }

        btnSubmit.classList.add('gf-login__submit--loading');
        btnSubmit.innerHTML = '<span class="gf-spinner"></span>登录中…';

        /* ★ 业务替换点：替换为真实登录接口调用，成功后跳转首页 */
        setTimeout(function () {
          btnSubmit.classList.remove('gf-login__submit--loading');
          btnSubmit.textContent = '登录';
        }, 800);
      });

      /* ★ 业务替换点：忘记密码跳转地址 */
      document.getElementById('btnForgot').addEventListener('click', function () {
        showAlert('找回密码请联系系统管理员，或前往统一身份认证平台重置。');
      });
    })();
  </script>
</body>
</html>
