<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基础表单 - 新建客户</title>
  <style>
    :root {
      --color-primary: #2A6CDD;
      --color-primary-hover: #1E5BBF;
      --color-primary-active: #164A9E;
      --color-success: #52C41A;
      --color-warning: #FAAD14;
      --color-error: #F5222D;
      --color-nav: #0C1D43;
      --color-bg-canvas: #F7F8FA;
      --color-bg-card: #FFFFFF;
      --color-border: #F0F2F5;
      --color-text: #313133;
      --color-text-secondary: #67696E;
      --color-text-tertiary: #939599;
      --color-text-heading: #13161B;
      --color-required: #F5222D; /* 等价于 --color-error，保留语义别名 */
      --radius-btn: 2px;
      --radius-card: 4px;
      --shadow-card: 0 2px 8px rgba(0,0,0,0.10);
      --shadow-dropdown: 0 6px 16px rgba(0,0,0,0.12);
      --space-1: 4px; --space-2: 8px; --space-3: 12px;
      --space-4: 16px; --space-5: 20px; --space-6: 24px;
      --font-family: 'Microsoft YaHei', 'PingFang SC', 'SF Pro Display', 'DIN Alternate', sans-serif;
      --font-number: 'DIN Alternate', 'DIN', 'SF Pro Display', 'Helvetica Neue', sans-serif;
          --color-white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background: var(--color-bg-canvas);
      color: var(--color-text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding: var(--space-6);
    }

    /* 页面标题区 */
    .gf-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-4);
    }

    .gf-page-header__title {
      font-size: 20px;
      font-weight: 600;
      color: var(--color-text-heading);
      line-height: 28px;
    }

    .gf-link {
      color: var(--color-primary);
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: var(--font-family);
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
    }

    .gf-link:hover {
      color: var(--color-primary-hover);
    }

    .gf-link__icon {
      width: 14px;
      height: 14px;
    }

    /* 表单卡 */
    .gf-form-card {
      background: var(--color-bg-card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: var(--space-6);
    }

    /* 表单字段 */
    .gf-form-item {
      display: flex;
      flex-direction: column;
      margin-bottom: var(--space-6);
    }

    .gf-form-item:last-of-type {
      margin-bottom: var(--space-6);
    }

    .gf-form-item__label {
      font-size: 14px;
      color: var(--color-text-secondary);
      margin-bottom: var(--space-2);
      line-height: 22px;
    }

    .gf-form-item__required {
      color: var(--color-required);
      margin-left: 2px;
    }

    /* 输入框 */
    .gf-input {
      width: 328px;
      height: 32px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-btn);
      padding: 0 var(--space-3);
      font-size: 14px;
      color: var(--color-text);
      background: var(--color-bg-card);
      outline: none;
      transition: border-color 0.2s;
      font-family: var(--font-family);
    }

    .gf-input::placeholder {
      color: var(--color-text-tertiary);
    }

    .gf-input:focus {
      border-color: var(--color-primary);
    }

    .gf-input--wide {
      width: 552px;
    }

    /* 选择器 */
    .gf-select {
      width: 328px;
      height: 32px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-btn);
      padding: 0 var(--space-3);
      font-size: 14px;
      color: var(--color-text);
      background: var(--color-bg-card);
      outline: none;
      transition: border-color 0.2s;
      font-family: var(--font-family);
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 12 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3 4.5L6 7.5L9 4.5' stroke='%23939599' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 32px;
      cursor: pointer;
    }

    .gf-select:focus {
      border-color: var(--color-primary);
    }

    .gf-select--placeholder {
      color: var(--color-text-tertiary);
    }

    /* 文本域 */
    .gf-textarea {
      width: 552px;
      height: 96px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-btn);
      padding: var(--space-2) var(--space-3);
      font-size: 14px;
      color: var(--color-text);
      background: var(--color-bg-card);
      outline: none;
      transition: border-color 0.2s;
      font-family: var(--font-family);
      resize: none;
      line-height: 1.5;
    }

    .gf-textarea::placeholder {
      color: var(--color-text-tertiary);
    }

    .gf-textarea:focus {
      border-color: var(--color-primary);
    }

    /* 按钮区 */
    .gf-form-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-6);
    }

    .gf-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      height: 32px;
      padding: 0 var(--space-4);
      font-size: 14px;
      font-family: var(--font-family);
      border: 1px solid var(--color-primary);
      background: var(--color-primary);
      color: var(--color-white);
      border-radius: var(--radius-btn);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
      line-height: 1;
    }

    .gf-btn:hover {
      background: var(--color-primary-hover);
      border-color: var(--color-primary-hover);
    }

    .gf-btn:active {
      background: var(--color-primary-active);
      border-color: var(--color-primary-active);
    }

    .gf-btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      height: 32px;
      padding: 0 var(--space-4);
      font-size: 14px;
      font-family: var(--font-family);
      border: 1px solid var(--color-border);
      background: var(--color-bg-card);
      color: var(--color-text);
      border-radius: var(--radius-btn);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      white-space: nowrap;
      line-height: 1;
    }

    .gf-btn-secondary:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
  </style>
</head>
<body>
  <!-- 页面标题区 -->
  <div class="gf-page-header">
    <h1 class="gf-page-header__title">新建客户</h1>
    <button class="gf-link">
      <svg class="gf-link__icon" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 2L2 7L6 12M2 7H12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      返回
    </button>
  </div>

  <!-- 表单卡 -->
  <form class="gf-form-card">
    <!-- 客户名称 -->
    <div class="gf-form-item">
      <label class="gf-form-item__label">
        客户名称<span class="gf-form-item__required">*</span>
      </label>
      <input class="gf-input" type="text" placeholder="请输入客户名称" />
    </div>

    <!-- 客户类型 -->
    <div class="gf-form-item">
      <label class="gf-form-item__label">客户类型</label>
      <select class="gf-select gf-select--placeholder">
        <option value="" selected>请选择客户类型</option>
        <option value="enterprise">企业客户</option>
        <option value="vip">VIP客户</option>
        <option value="potential">潜在客户</option>
        <option value="normal">普通客户</option>
      </select>
    </div>

    <!-- 联系电话 -->
    <div class="gf-form-item">
      <label class="gf-form-item__label">联系电话</label>
      <input class="gf-input" type="text" placeholder="请输入联系电话" />
    </div>

    <!-- 邮箱地址 -->
    <div class="gf-form-item">
      <label class="gf-form-item__label">邮箱地址</label>
      <input class="gf-input" type="text" placeholder="请输入邮箱地址" />
    </div>

    <!-- 客户地址 -->
    <div class="gf-form-item">
      <label class="gf-form-item__label">客户地址</label>
      <input class="gf-input gf-input--wide" type="text" placeholder="请输入客户地址" />
    </div>

    <!-- 备注 -->
    <div class="gf-form-item">
      <label class="gf-form-item__label">备注</label>
      <textarea class="gf-textarea" placeholder="请输入备注信息"></textarea>
    </div>

    <!-- 底部按钮区 -->
    <div class="gf-form-actions">
      <button type="button" class="gf-btn-secondary">取消</button>
      <button type="submit" class="gf-btn">提交</button>
    </div>
  </form>
</body>
</html>
