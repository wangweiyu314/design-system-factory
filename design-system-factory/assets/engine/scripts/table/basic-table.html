<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基础表格 - 客户列表</title>
  <style>
    :root {
      --color-primary: #2A6CDD;
      --color-primary-hover: #1E5BBF;
      --color-primary-active: #164A9E;
      --color-success: #52C41A;
      --color-warning: #FAAD14;
      --color-error: #F5222D;
      /* ---- 涨跌色（境内业务习惯：涨红跌绿，禁止用功能色表达趋势） ---- */
      --color-up: #F5222D;
      --color-down: #52C41A;
      --color-nav: #0C1D43;
      --color-bg-canvas: #F7F8FA;
      --color-bg-card: #FFFFFF;
      --color-border: #F0F2F5;
      --color-table-divider: #E6EAF0;
      --color-table-row-hover: #F5F5F5;
      --color-table-action: #2A6CDD;
      --color-table-action-hover: #1E5BBF;
      --color-text: #313133;
      --color-text-secondary: #67696E;
      --color-text-tertiary: #939599;
      --color-text-heading: #13161B;
      /* 功能色文本／背景（标签配色统一来源） */
      --color-success-text: #2CAA41;
      --color-success-bg: #E6F6EB;
      --color-warning-text: #E97D30;
      --color-warning-bg: #FCEFE6;
      --color-fill-secondary: #F0F2F5;
      --tag-blue-bg: #EAF0FC;
      --tag-blue-text: #2A6CDD;
      --radius-btn: 2px;
      --radius-card: 4px;
      --shadow-card: 0 2px 8px rgba(0,0,0,0.10);
      --shadow-dropdown: 0 6px 16px rgba(0,0,0,0.12);
      --space-1: 4px; --space-2: 8px; --space-3: 12px;
      --space-4: 16px; --space-5: 20px; --space-6: 24px;
      --font-family: 'Microsoft YaHei', 'PingFang SC', 'SF Pro Display', 'DIN Alternate', sans-serif;
      --font-number: 'DIN Alternate', 'DIN', 'SF Pro Display', 'Helvetica Neue', sans-serif;
          --color-white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background: var(--color-bg-canvas);
      color: var(--color-text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding: var(--space-6);
    }

    /* 页面标题区 */
    .gf-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-4);
    }

    .gf-page-header__title {
      font-size: 20px;
      font-weight: 600;
      color: var(--color-text-heading);
      line-height: 28px;
    }

    /* 按钮 */
    .gf-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      height: 32px;
      padding: 0 var(--space-4);
      font-size: 14px;
      font-family: var(--font-family);
      border: 1px solid var(--color-primary);
      background: var(--color-primary);
      color: var(--color-white);
      border-radius: var(--radius-btn);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
      line-height: 1;
    }

    .gf-btn:hover {
      background: var(--color-primary-hover);
      border-color: var(--color-primary-hover);
    }

    .gf-btn:active {
      background: var(--color-primary-active);
      border-color: var(--color-primary-active);
    }

    .gf-btn__icon {
      width: 14px;
      height: 14px;
    }

    /* 表格卡 */
    .gf-table-card {
      background: var(--color-bg-card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: var(--space-6);
    }

    /* 工具栏 */
    .gf-table-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-4);
    }

    .gf-table-toolbar__title {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-heading);
    }

    .gf-table-toolbar__right {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .gf-input {
      width: 216px;
      height: 32px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-btn);
      padding: 0 var(--space-3);
      font-size: 13px;
      color: var(--color-text);
      background: var(--color-bg-card);
      outline: none;
      transition: border-color 0.2s;
      font-family: var(--font-family);
    }

    .gf-input::placeholder {
      color: var(--color-text-tertiary);
    }

    .gf-input:focus {
      border-color: var(--color-primary);
    }

    .gf-btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      height: 32px;
      padding: 0 var(--space-3);
      font-size: 14px;
      font-family: var(--font-family);
      border: 1px solid var(--color-border);
      background: var(--color-bg-card);
      color: var(--color-text);
      border-radius: var(--radius-btn);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      white-space: nowrap;
      line-height: 1;
    }

    .gf-btn-secondary:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .gf-btn-secondary__icon {
      width: 14px;
      height: 14px;
    }

    /* 表格 */
    .gf-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .gf-table thead th {
      background: var(--color-bg-canvas);
      font-weight: 500;
      color: var(--color-text);
      text-align: left;
      padding: 0 var(--space-4);
      height: 44px;
      white-space: nowrap;
      border-bottom: 1px solid var(--color-table-divider);
    }

    .gf-table thead th:first-child,
    .gf-table tbody td:first-child {
      padding-left: var(--space-4);
    }

    .gf-table thead th:last-child,
    .gf-table tbody td:last-child {
      padding-right: var(--space-4);
    }

    .gf-table tbody td {
      padding: 0 var(--space-4);
      height: 52px;
      color: var(--color-text);
      border-bottom: 1px solid var(--color-table-divider);
      vertical-align: middle;
    }

    .gf-table tbody tr:last-child td {
      border-bottom: none;
    }

    .gf-table tbody tr:hover {
      background: var(--color-table-row-hover);
    }

    /* 数字列 */
    .gf-table .number-col {
      font-family: var(--font-number);
      letter-spacing: 0.2px;
    }

    /*
      涨跌色（境内习惯：涨红 --color-up / 跌绿 --color-down）。
      必须用涨跌专用 Token，禁止借功能色 --color-error / --color-success 表达趋势。
      注意特异性：上面的 .gf-table tbody td 带 color 声明，特异性 (0,1,2)，
      单独的 .gf-trend--up 只有 (0,1,0)，会被 td 的 color 吃掉导致「写了红绿却不显示」。
      因此必须写成 td 级。配合 ▲▼ 箭头，不靠颜色单独传达方向。
    */
    .gf-table tbody td.gf-trend--up { color: var(--color-up); }
    .gf-table tbody td.gf-trend--down { color: var(--color-down); }
    .gf-trend--up { color: var(--color-up); }
    .gf-trend--down { color: var(--color-down); }
    .gf-trend__arrow { font-size: 9px; margin-right: 3px; vertical-align: 1px; }

    /* 标签 */
    .gf-tag {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 var(--space-2);
      font-size: 12px;
      line-height: 1;
      border-radius: var(--radius-btn);
      white-space: nowrap;
    }

    .gf-tag--blue {
      background: var(--tag-blue-bg);
      color: var(--tag-blue-text);
    }

    .gf-tag--green {
      background: var(--color-success-bg);
      color: var(--color-success-text);
    }

    .gf-tag--orange {
      background: var(--color-warning-bg);
      color: var(--color-warning-text);
    }

    .gf-tag--gray {
      background: var(--color-fill-secondary);
      color: var(--color-text-secondary);
    }

    /* 操作链接 */
    .gf-table-action {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .gf-link {
      color: var(--color-table-action);
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: var(--font-family);
      transition: color 0.2s;
      white-space: nowrap;
    }

    .gf-link:hover {
      color: var(--color-table-action-hover);
    }

    /* 分页 */
    .gf-pagination {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-1);
      margin-top: var(--space-4);
    }

    .gf-pagination__total {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-right: var(--space-3);
    }

    .gf-pagination__btn {
      min-width: 32px;
      height: 32px;
      padding: 0 var(--space-2);
      border: 1px solid var(--color-border);
      background: var(--color-bg-card);
      color: var(--color-text);
      font-size: 14px;
      border-radius: var(--radius-btn);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s;
      font-family: var(--font-number);
    }

    .gf-pagination__btn:hover:not(.gf-pagination__btn--disabled) {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .gf-pagination__btn--disabled {
      color: var(--color-text-tertiary);
      cursor: not-allowed;
    }

    .gf-pagination__item {
      min-width: 32px;
      height: 32px;
      padding: 0 var(--space-1);
      border: 1px solid var(--color-border);
      background: var(--color-bg-card);
      color: var(--color-text);
      font-size: 14px;
      border-radius: var(--radius-btn);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-number);
      transition: all 0.2s;
    }

    .gf-pagination__item:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .gf-pagination__item--active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: var(--color-white);
    }

    .gf-pagination__item--active:hover {
      color: var(--color-white);
    }

    .gf-pagination__jump {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-left: var(--space-3);
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
    }

    .gf-pagination__jump-input {
      width: 48px;
      height: 32px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-btn);
      text-align: center;
      font-size: 14px;
      color: var(--color-text);
      outline: none;
      font-family: var(--font-number);
    }

    .gf-pagination__jump-input:focus {
      border-color: var(--color-primary);
    }
  </style>
</head>
<body>
  <!-- 页面标题区 -->
  <div class="gf-page-header">
    <h1 class="gf-page-header__title">客户列表</h1>
    <button class="gf-btn">
      <svg class="gf-btn__icon" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 2V12M2 7H12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>

      新建客户
    </button>

  <!-- 表格卡 -->

          筛选
        </button>
      </div>
    </div>

    <!-- 表格 -->
    <table class="gf-table">
      <thead>
        <tr>
          <th>客户编号</th>
          <th>客户名称</th>
          <th>客户类型</th>
          <th>负责人</th>

          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="number-col">KH20240001</td>

        </tr>
        <tr>
          <td class="number-col">KH20240002</td>

          <td><span class="gf-tag gf-tag--green">VIP客户</span></td>
          <td>李四</td>
          <td class="number-col">2024-02-08</td>
          <td>
            <div class="gf-table-action">
              <button class="gf-link">编辑</button>
              <button class="gf-link">详情</button>
            </div>
          </td>
        </tr>
        <tr>
          <td class="number-col">KH20240003</td>
          <td>中信建投基金管理有限公司</td>
          <td><span class="gf-tag gf-tag--blue">企业客户</span></td>
          <td>王五</td>
          <td class="number-col">2024-03-12</td>
          <td>
            <div class="gf-table-action">
              <button class="gf-link">编辑</button>
              <button class="gf-link">详情</button>
            </div>
          </td>
        </tr>
        <tr>
          <td class="number-col">KH20240004</td>
          <td>南方基金管理有限公司</td>
          <td><span class="gf-tag gf-tag--orange">潜在客户</span></td>
          <td>赵六</td>

          <td>
            <div class="gf-table-action">
              <button class="gf-link">编辑</button>

        </tr>
      </tbody>
    </table>

    <!-- 分页区 -->
    <div class="gf-pagination">
      <span class="gf-pagination__total">共 128 条</span>
      <button class="gf-pagination__btn gf-pagination__btn--disabled">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">

  </div>
</body>
</html>
