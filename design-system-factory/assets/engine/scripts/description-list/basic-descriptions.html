<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>描述列表 - 合同详情</title>
  <style>
    :root {
      --color-primary: #2A6CDD;
      --color-primary-hover: #1E5BBF;
      --color-primary-active: #164A9E;
      --color-success: #52C41A;
      --color-warning: #FAAD14;
      --color-error: #F5222D;
      --color-nav: #0C1D43;
      --color-bg-canvas: #F7F8FA;
      --color-bg-card: #FFFFFF;
      --color-border: #F0F2F5;
      --color-text: #313133;
      --color-text-secondary: #67696E;
      --color-text-tertiary: #939599;
      --color-text-heading: #13161B;
      --radius-btn: 2px;
      --radius-card: 4px;
      --shadow-card: 0 2px 8px rgba(0,0,0,0.10);
      --shadow-dropdown: 0 6px 16px rgba(0,0,0,0.12);
      --space-1: 4px; --space-2: 8px; --space-3: 12px;
      --space-4: 16px; --space-5: 20px; --space-6: 24px;
      --font-family: 'Microsoft YaHei', 'PingFang SC', 'SF Pro Display', 'DIN Alternate', sans-serif;
      --font-number: 'DIN Alternate', 'DIN', 'SF Pro Display', 'Helvetica Neue', sans-serif;
          --tag-blue-bg: #EAF0FC;
      --color-success-bg: #E6F6EB;
      --color-success-text: #2CAA41;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background: var(--color-bg-canvas);
      color: var(--color-text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding: var(--space-6);
    }

    /* 页面标题区 */
    .gf-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-4);
    }

    .gf-page-header__title {
      font-size: 20px;
      font-weight: 600;
      color: var(--color-text-heading);
      line-height: 28px;
    }

    .gf-link {
      color: var(--color-primary);
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: var(--font-family);
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
    }

    .gf-link:hover {
      color: var(--color-primary-hover);
    }

    .gf-link__icon {
      width: 14px;
      height: 14px;
    }

    /* 详情卡 */
    .gf-descriptions-card {
      background: var(--color-bg-card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: var(--space-6);
    }

    /* 描述列表网格 (3列) */
    .gf-descriptions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      column-gap: var(--space-6);
      row-gap: var(--space-4);
    }

    .gf-descriptions__item {
      display: flex;
      align-items: flex-start;
    }

    .gf-descriptions__item--full {
      grid-column: 1 / -1;
      flex-direction: column;
    }

    .gf-descriptions__label {
      width: 120px;
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 400;
      color: var(--color-text-tertiary);
      text-align: right;
      line-height: 22px;
      padding-right: var(--space-3);
    }

    .gf-descriptions__value {
      flex: 1;
      font-size: 14px;
      font-weight: 400;
      color: var(--color-text);
      line-height: 22px;
      min-width: 0;
      word-break: break-all;
    }

    .gf-descriptions__value--number {
      font-family: var(--font-number);
      letter-spacing: 0.2px;
    }

    /* 长文本 label/value 在 full 模式下 */
    .gf-descriptions__item--full .gf-descriptions__label {
      width: 120px;
      text-align: right;
      padding-right: var(--space-3);
      margin-bottom: var(--space-2);
    }

    .gf-descriptions__item--full .gf-descriptions__value {
      width: 100%;
    }

    .gf-descriptions__block {
      background: var(--color-bg-canvas);
      border-radius: var(--radius-btn);
      padding: var(--space-3) var(--space-4);
      font-size: 14px;
      color: var(--color-text-secondary);
      line-height: 22px;
      width: 100%;
    }

    /* 标签 */
    .gf-tag {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 var(--space-2);
      font-size: 12px;
      line-height: 1;
      border-radius: var(--radius-btn);
      white-space: nowrap;
    }

    .gf-tag--blue {
      background: var(--tag-blue-bg);
      color: var(--color-primary);
    }

    .gf-tag--green {
      background: var(--color-success-bg);
      color: var(--color-success-text);
    }
  </style>
</head>
<body>
  <!-- 页面标题区 -->
  <div class="gf-page-header">
    <h1 class="gf-page-header__title">合同详情 - HT20240001</h1>
    <button class="gf-link">
      <svg class="gf-link__icon" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.5 1.5L12.5 4.5L5 12L1.5 12.5L2 9L9.5 1.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M8 3L11 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      编辑
    </button>
  </div>

  <!-- 详情卡 -->
  <div class="gf-descriptions-card">
    <dl class="gf-descriptions">
      <div class="gf-descriptions__item">
        <dt class="gf-descriptions__label">合同编号</dt>
        <dd class="gf-descriptions__value gf-descriptions__value--number">HT20240001</dd>
      </div>
      <div class="gf-descriptions__item">
        <dt class="gf-descriptions__label">合同名称</dt>
        <dd class="gf-descriptions__value">2024年度技术服务合同</dd>
      </div>
      <div class="gf-descriptions__item">
        <dt class="gf-descriptions__label">合同类型</dt>
        <dd class="gf-descriptions__value">
          <span class="gf-tag gf-tag--blue">框架合同</span>
        </dd>
      </div>

      <div class="gf-descriptions__item">
        <dt class="gf-descriptions__label">签约客户</dt>
        <dd class="gf-descriptions__value">广发证券股份有限公司</dd>
      </div>
      <div class="gf-descriptions__item">
        <dt class="gf-descriptions__label">合同金额</dt>
        <dd class="gf-descriptions__value gf-descriptions__value--number">¥1,286,000.00</dd>
      </div>
      <div class="gf-descriptions__item">
        <dt class="gf-descriptions__label">签约日期</dt>
        <dd class="gf-descriptions__value gf-descriptions__value--number">2024-01-15</dd>
      </div>

      <div class="gf-descriptions__item">
        <dt class="gf-descriptions__label">合同状态</dt>
        <dd class="gf-descriptions__value">
          <span class="gf-tag gf-tag--green">履行中</span>
        </dd>
      </div>
      <div class="gf-descriptions__item">
        <dt class="gf-descriptions__label">负责人</dt>
        <dd class="gf-descriptions__value">张三</dd>
      </div>
      <div class="gf-descriptions__item">
        <dt class="gf-descriptions__label">联系电话</dt>
        <dd class="gf-descriptions__value gf-descriptions__value--number">138-0000-0000</dd>
      </div>

      <!-- 长文本字段：占满整行 -->
      <div class="gf-descriptions__item gf-descriptions__item--full">
        <dt class="gf-descriptions__label">合同说明</dt>
        <dd class="gf-descriptions__value">
          <div class="gf-descriptions__block">
            这是一份关于2024年度技术服务的框架合同，涵盖系统开发、运维支持及技术咨询等综合服务内容。合同有效期自2024年1月15日起至2024年12月31日止，合同总金额为人民币壹佰贰拾捌万陆仟元整。双方约定按季度进行服务交付与结算，具体服务范围及验收标准详见合同附件。
          </div>
        </dd>
      </div>
    </dl>
  </div>
</body>
</html>
