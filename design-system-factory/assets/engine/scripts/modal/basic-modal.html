  <title>弹窗模板 - 广发中后台设计系统</title>
  <!--
    ============================================================
    模板：弹窗 Modal（三段式）
    规范：components/feedback.md §1 + §Modal 三段式结构规范 + foundation/tokens.md
    版本：design-specs v2.6

    三段式结构（强制）：
      .gf-modal__header  高度 --floating-header-height(52px) / padding 0 24px / 底分割线
      .gf-modal__body    padding 24px / 唯一滚动区，禁止把按钮放进 body
      .gf-modal__footer  高度 --floating-footer-height(52px) / padding 12px 24px / 顶分割线 / 按钮右对齐

    三档宽度（禁止自由数值）：
      --modal-confirm-width  480px  二次确认、简短提示
      --modal-form-width     640px  普通单列表单
      --modal-complex-width  800px  复杂表单、多模块配置、列表弹窗

    必做替换（搜索「业务替换点」）：
      1. 弹窗标题 .gf-modal__title 文案
      2. body 内容（表单字段 / 表格 / 提示文案）
      3. footer 按钮文案与回调（onConfirm / onCancel）
      4. 展示类浮层可删除整个 .gf-modal__footer（等于 React 的 footer={null}）

    强约束（改动即踩坑）：
      · container 必须 padding: 0，否则会多叠一圈空白、分割线左右不到头
      · 必须上下居中（align-items: center），禁止贴顶
      · 必须有视口兜底 max-width: calc(100vw - 48px)
      · 展示类（详情、只读）默认不生成 footer；操作类（新增、编辑、审批）必须有固定可见操作区
      · 图标必须内联 SVG，禁止图标库、图标字体、外链图片
    ============================================================
  -->
  <style>
    :root {
      /* ---- 品牌与功能色（取值唯一来源：foundation/tokens.md） ---- */
      --color-primary: #2A6CDD;
      --color-primary-hover: #1E5BBF;
      --color-primary-active: #164A9E;
      --color-primary-light: rgba(42, 108, 221, 0.1);
      --color-primary-focus: rgba(42, 108, 221, 0.2);
      --color-error: #F5222D;
      --color-error-text: #C80000;
      --color-on-primary: #FFFFFF;
      /* ---- 中性色 ---- */
      --color-white: #FFFFFF;
      --color-bg-canvas: #F7F8FA;
      --color-bg-card: #FFFFFF;
      --color-text: #313133;
      --color-text-secondary: #67696E;
      --color-text-tertiary: #939599;
      --color-text-quaternary: #C8C9CC;
      --color-text-heading: #13161B;
      --color-border: #F0F2F5;
      --color-border-secondary: #E6EAF0;
      --color-border-strong: #D7DCE0;
      /* ---- 表格（复杂弹窗内嵌表格用） ---- */
      --color-table-header-bg: #F7F8FA;
      --color-table-row-hover: #F5F5F5;
      --color-table-action: #2A6CDD;
      --color-table-action-hover: #1E5BBF;
      --color-table-divider: #E6EAF0;
      /* ---- 浮层遮罩与尺寸 ---- */
      --color-mask: rgba(0, 0, 0, 0.6);
      --modal-confirm-width: 480px;
      --modal-form-width: 640px;
      --modal-complex-width: 800px;
      --floating-header-height: 52px;
      --floating-footer-height: 52px;
      --floating-content-padding: 24px;
      /* ---- 圆角 / 阴影 / 间距 / 字号 / 动效 ---- */
      --radius-btn: 2px;
      --radius-card: 4px;
      --shadow-medium: 0px 6px 16px rgba(0, 0, 0, 0.12);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --font-family: 'Microsoft YaHei', 'PingFang SC', 'SF Pro Display', 'DIN Alternate', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      --font-size-body: 14px;
      --font-size-body-lg: 16px;
      --font-size-body-sm: 12px;
      --line-height-body: 1.5em;
      --transition-fast: 200ms ease-in-out;
      --z-index-nav-popup: 1100;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: var(--space-8);
      font-family: var(--font-family);
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      color: var(--color-text);
      background: var(--color-bg-canvas);
    }

    /* ============================================================
       演示用触发区（业务接入时删除）
       ============================================================ */
    .demo-launch { max-width: 800px; margin: 0 auto; }
    .demo-launch h1 { font-size: var(--font-size-body-lg); font-weight: 500; color: var(--color-text-heading); margin: 0 0 var(--space-4); }
    .demo-launch__row { display: flex; gap: var(--space-3); flex-wrap: wrap; }

    /* ============================================================
       按钮（组件级，业务可直接复用）
       语义：裸 .gf-btn = 主按钮，--secondary = 次按钮，--danger = 危险
       规范：components/basic.md §按钮 CSS 类语义（强制）
       禁止再写 .gf-btn--primary（历史上语义相反，会导致宿主页面按钮被覆盖）
       ============================================================ */
    .gf-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1);
      min-width: 76px; height: 32px;
      padding: 0 var(--space-4);
      font-family: var(--font-family);
      font-size: var(--font-size-body);
      line-height: 1;
      border-radius: var(--radius-btn);
      border: 1px solid var(--color-primary);
      background: var(--color-primary);
      color: var(--color-on-primary);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-fast);
    }
    .gf-btn:hover { background: var(--color-primary-hover); border-color: var(--color-primary-hover); }
    .gf-btn:active { background: var(--color-primary-active); border-color: var(--color-primary-active); }
    .gf-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--color-primary-focus); }
    .gf-btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

    .gf-btn--secondary {
      background: var(--color-bg-card);
      border-color: var(--color-border-strong);
      color: var(--color-text);
    }
    .gf-btn--secondary:hover { border-color: var(--color-primary); color: var(--color-primary); }

    .gf-btn--danger {
      background: var(--color-error);
      border-color: var(--color-error);
      color: var(--color-on-primary);
    }
    .gf-btn--danger:hover { background: var(--color-error-text); border-color: var(--color-error-text); color: var(--color-on-primary); }

    /* ============================================================
       Modal 遮罩与容器
       ============================================================ */
    .gf-modal-mask {
      position: fixed;
      inset: 0;
      z-index: var(--z-index-nav-popup);
      display: flex;
      align-items: center;          /* 上下居中，禁止用 top: 100px */
      justify-content: center;
      padding: var(--space-6);
      background: var(--color-mask);
    }
    .gf-modal-mask[hidden] { display: none; }

    .gf-modal {
      display: flex;
      flex-direction: column;
      width: var(--modal-form-width);
      max-width: calc(100vw - 48px);   /* 视口兜底，禁止溢出 */
      max-height: calc(100vh - 48px);
      padding: 0;                      /* 强制清零，否则分割线左右不到头 */
      overflow: hidden;                /* 圆角裁切，滚动交给 body */
      background: var(--color-white);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-medium);
    }

    /* 三档宽度：通过修饰类切换，禁止写死 width */
    .gf-modal--confirm { width: var(--modal-confirm-width); }
    .gf-modal--form    { width: var(--modal-form-width); }
    .gf-modal--complex { width: var(--modal-complex-width); }

    /* ---- 头部 ---- */
    .gf-modal__header {
      flex: 0 0 var(--floating-header-height);
      height: var(--floating-header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: 0 var(--floating-content-padding);
      margin-bottom: 0;
      border-bottom: 1px solid var(--color-border-secondary);
    }
    .gf-modal__title {
      margin: 0;
      font-size: var(--font-size-body);
      font-weight: 500;
      color: var(--color-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .gf-modal__close {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px; height: 24px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--color-text-tertiary);
      cursor: pointer;
      border-radius: var(--radius-btn);
      transition: color var(--transition-fast), background var(--transition-fast);
    }
    .gf-modal__close:hover { color: var(--color-text); background: var(--color-border); }
    .gf-modal__close:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--color-primary-focus); }

    /* ---- 主体：唯一滚动区 ---- */
    .gf-modal__body {
      flex: 1 1 auto;
      padding: var(--floating-content-padding);
      overflow: auto;
      max-height: calc(100vh - 180px);
      max-height: calc(100dvh - 180px);
    }

    /* ---- 底部操作区 ---- */
    .gf-modal__footer {
      flex: 0 0 var(--floating-footer-height);
      height: var(--floating-footer-height);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-2);
      padding: var(--space-3) var(--floating-content-padding);
      margin-top: 0;
      border-top: 1px solid var(--color-border-secondary);
    }

    /* ============================================================
       表单区（业务替换点：换成真实字段）
       ============================================================ */
    .gf-form-field { margin-bottom: var(--space-4); }
    .gf-form-field:last-child { margin-bottom: 0; }
    .gf-form-field__label {
      display: block;
      margin-bottom: var(--space-2);
      font-size: var(--font-size-body);
      color: var(--color-text-secondary);
    }
    .gf-form-field__required { color: var(--color-error); margin-right: var(--space-1); }
    .gf-form-field__control {
      width: 100%; height: 32px;
      padding: 0 var(--space-3);
      font-family: var(--font-family);
      font-size: var(--font-size-body);
      color: var(--color-text);
      background: var(--color-white);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-btn);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .gf-form-field__control:hover { border-color: var(--color-primary); }
    .gf-form-field__control:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 2px var(--color-primary-focus); }
    .gf-form-field__control::placeholder { color: var(--color-text-quaternary); }

    /* ============================================================
       内嵌表格（复杂弹窗用）
       ============================================================ */
    .gf-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--font-size-body); }
    .gf-table th {
      padding: var(--space-3) var(--space-4);
      text-align: left;
      font-weight: 500;
      color: var(--color-text-secondary);
      background: var(--color-table-header-bg);
      border-bottom: 1px solid var(--color-border-secondary);
      white-space: nowrap;
    }
    .gf-table td {
      padding: var(--space-3) var(--space-4);
      color: var(--color-text);
      border-bottom: 1px solid var(--color-border-secondary);
    }
    .gf-table tbody tr:hover td { background: var(--color-table-row-hover); }
    .gf-link {
      padding: 0;
      font-family: var(--font-family);
      font-size: var(--font-size-body);
      color: var(--color-table-action);
      background: none;
      border: none;
      cursor: pointer;
    }
    .gf-link:hover { color: var(--color-table-action-hover); }

    /* 提示类正文 */
    .gf-modal__text { margin: 0; color: var(--color-text-secondary); }
    .gf-modal__text strong { color: var(--color-text); font-weight: 500; }
  </style>
</head>

  <script>
    /* ============================================================
       弹窗开关（业务接入时替换为框架态管理，如 React open 受控）
       ============================================================ */
    var openMask = null;

    function openModal(id) {
      var mask = document.getElementById(id);
      if (!mask) return;
      mask.hidden = false;
      openMask = mask;
    }

    function closeModal() {
      if (openMask) openMask.hidden = true;
      openMask = null;
    }

    /* 触发按钮 */
    document.querySelectorAll('[data-modal-open]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        openModal(btn.getAttribute('data-modal-open'));
      });
    });

    /* 关闭：关闭图标 / 取消按钮 / 点击遮罩空白 */
    document.querySelectorAll('[data-modal-close]').forEach(function (btn) {
      btn.addEventListener('click', closeModal);
    });
    document.querySelectorAll('.gf-modal-mask').forEach(function (mask) {
      mask.addEventListener('click', function (e) {
        if (e.target === mask) closeModal();
      });
    });

    /* 确认按钮：业务替换点 —— 换成真实提交逻辑 */
    document.querySelectorAll('[data-modal-confirm]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        closeModal();
      });
    });

    /* Esc 关闭 */
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });
  </script>
